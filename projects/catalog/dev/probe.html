<!doctype html>
<!--
  Development only (angular.json: the "development" configuration's assets): measures a page of the
  catalog the way the kit's rules ask, for a headless browser that cannot run scripts of its own.
  /probe.html?url=/components&w=390&h=844&wait=3000 loads the page in a same-origin frame of that size
  and writes what it measured in #out: the page's width against the frame's (a horizontal scroll is a
  fault), and what sticks out.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Probe</title>
  </head>
  <body style="margin: 0">
    <pre id="out">waiting</pre>
    <iframe id="frame" title="Page" style="border: 0; display: block"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const url = params.get('url') || '/';
      const width = Number(params.get('w') || 1280);
      const height = Number(params.get('h') || 900);
      const wait = Number(params.get('wait') || 3000);
      const frame = document.getElementById('frame');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      // shot=1: only the page, at its size, for a screenshot (a headless window has a least width).
      if (params.get('shot') === '1') document.getElementById('out').style.display = 'none';
      // clean=1: what the catalog keeps in this browser goes first (changed variables, choices).
      if (params.get('clean') === '1') localStorage.clear();
      // do=[{"fill": "selector", "text": "…"}, {"click": "selector"}, {"wait": 500}]: done on the page, in
      // order, before measuring (a selector "a >>> b" looks inside the frame a). Also {"key": "selector",
      // "name": "ArrowRight", "shift": true} (a key pressed on it) and {"press": "selector", "x": 0.5,
      // "y": 0.25, "to": [0.9, 0.1]} (a pointer pressed at that share of its box, dragged to `to`, released),
      // {"back": true} (the browser's back, as a phone's back gesture: a dialog opened with LenziDialogs closes),
      // and {"scroll": "selector", "block": "end"} (brought into view: at the centre, or where `block` says).
      const actions = JSON.parse(params.get('do') || '[]');
      const pick = (selector) => {
        let scope = frame.contentDocument;
        const parts = selector.split('>>>').map((part) => part.trim());
        for (const part of parts.slice(0, -1)) scope = scope.querySelector(part)?.contentDocument ?? scope;
        return scope.querySelector(parts[parts.length - 1]);
      };
      const act = async () => {
        for (const action of actions) {
          if (action.fill) {
            const field = pick(action.fill);
            if (field) {
              field.value = action.text;
              field.dispatchEvent(new Event('input', { bubbles: true }));
            }
          } else if (action.click) {
            pick(action.click)?.click();
          } else if (action.back) {
            frame.contentWindow.history.back();
          } else if (action.move) {
            // {"move": [0.8, 0.25]}: the mouse over the page, at that share of the frame (what follows
            // the pointer through the window, like a background, sees it)
            const view = frame.contentWindow;
            view.dispatchEvent(new view.PointerEvent('pointermove', { clientX: width * action.move[0], clientY: height * action.move[1], pointerType: 'mouse', bubbles: true }));
          } else if (action.scroll) {
            pick(action.scroll)?.scrollIntoView({ block: action.block ?? 'center' });
          } else if (action.key) {
            const target = pick(action.key);
            const view = target?.ownerDocument.defaultView;
            target?.dispatchEvent(new view.KeyboardEvent('keydown', { key: action.name, keyCode: action.name === 'Escape' ? 27 : 0, shiftKey: !!action.shift, bubbles: true, cancelable: true }));
          } else if (action.press) {
            const target = pick(action.press);
            if (target) {
              const view = target.ownerDocument.defaultView;
              const box = target.getBoundingClientRect();
              const at = (x, y) => ({ clientX: box.left + box.width * x, clientY: box.top + box.height * y, button: 0, pointerId: 7, bubbles: true, cancelable: true });
              target.dispatchEvent(new view.PointerEvent('pointerdown', at(action.x ?? 0.5, action.y ?? 0.5)));
              if (action.to) target.dispatchEvent(new view.PointerEvent('pointermove', at(action.to[0], action.to[1])));
              target.dispatchEvent(new view.PointerEvent('pointerup', at(...(action.to ?? [action.x ?? 0.5, action.y ?? 0.5]))));
            }
          }
          await new Promise((resolve) => setTimeout(resolve, action.wait ?? 400));
        }
      };
      frame.src = url;
      frame.onload = () =>
        setTimeout(async () => {
          await act();
          const page = frame.contentDocument;
          const root = page.documentElement;
          const clipped = (element) => {
            for (let parent = element.parentElement; parent && parent !== page.body; parent = parent.parentElement) {
              const overflow = getComputedStyle(parent).overflowX;
              if (overflow !== 'visible') return true;
            }
            return false;
          };
          const outside = [...page.querySelectorAll('body *')]
            .filter((element) => {
              const box = element.getBoundingClientRect();
              return box.width > 0 && box.right > width + 0.5 && getComputedStyle(element).position !== 'fixed' && !clipped(element);
            })
            .slice(0, 12)
            .map((element) => `${element.tagName.toLowerCase()}${element.className && typeof element.className === 'string' ? '.' + element.className.trim().split(/\s+/).join('.') : ''} right=${Math.round(element.getBoundingClientRect().right)}`);
          const result = {
            url,
            width,
            title: page.title,
            scrollWidth: root.scrollWidth,
            clientWidth: root.clientWidth,
            horizontalScroll: root.scrollWidth > root.clientWidth,
            outside,
            // What scrolls sideways inside the page (wider inside than it is): a code box may, a tab's body or a card must not.
            scrollers: [...page.querySelectorAll('body *')]
              .filter((element) => element.scrollWidth > element.clientWidth + 1 && element.clientWidth > 0 && getComputedStyle(element).overflowX !== 'visible')
              .slice(0, 12)
              .map((element) => `${element.tagName.toLowerCase()}${element.className && typeof element.className === 'string' ? '.' + element.className.trim().split(/\s+/).join('.') : ''} ${element.clientWidth}<${element.scrollWidth}`),
            // over=selector: what inside it reaches past its right edge (the reason it scrolls sideways).
            over: params.get('over')
              ? [...(page.querySelector(params.get('over'))?.querySelectorAll('*') ?? [])]
                  .filter((element) => element.getBoundingClientRect().width > 0 && element.getBoundingClientRect().right > page.querySelector(params.get('over')).getBoundingClientRect().right + 0.5)
                  .slice(0, 12)
                  .map((element) => `${element.tagName.toLowerCase()}${element.className && typeof element.className === 'string' ? '.' + element.className.trim().split(/\s+/).join('.') : ''} right=${Math.round(element.getBoundingClientRect().right)} w=${Math.round(element.getBoundingClientRect().width)}`)
              : undefined,
            headings: [...page.querySelectorAll('h1, h2')].slice(0, 8).map((h) => h.textContent.trim()),
            alerts: [...page.querySelectorAll('[role="alert"]')].map((a) => a.textContent.trim()),
            // read=sel|prop,…: what these say (a property of the element, its text by default).
            read: Object.fromEntries(
              (params.get('read') || '')
                .split(',')
                .filter(Boolean)
                .map((entry) => {
                  const [selector, property] = entry.split('|');
                  const element = pick(selector);
                  const value = !element ? null : property?.startsWith('--') ? getComputedStyle(element).getPropertyValue(property).trim() : property ? (element[property] ?? element.getAttribute(property)) : element.textContent.trim();
                  return [entry, value];
                }),
            ),
            // q=.a,.b: where each of these is (the first match), in px of the frame.
            boxes: Object.fromEntries(
              (params.get('q') || '')
                .split(',')
                .filter(Boolean)
                .map((selector) => {
                  const element = page.querySelector(selector);
                  const box = element?.getBoundingClientRect();
                  return [selector, box ? { x: Math.round(box.x), y: Math.round(box.y), w: Math.round(box.width), h: Math.round(box.height) } : null];
                }),
            ),
          };
          document.getElementById('out').textContent = JSON.stringify(result, null, 1);
        }, wait);
    </script>
  </body>
</html>
