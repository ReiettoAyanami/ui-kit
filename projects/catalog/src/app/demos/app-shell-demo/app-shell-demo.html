<lenzi-app-shell [title]="title()" [bare]="!!values()['bare']">
  <lenzi-nav-list lenziShellNav appName="Substance tracker" subtitle="lenzi" [pages]="pages" [bottom]="bottom" (pressed)="log('pressed ' + $event)" (navigated)="log('went to ' + $event.label)" />
  @if (values()['actions']) {
    <lenzi-notification-bell lenziShellActions noun="tickets" [items]="news" (opened)="log('bell opened')" />
  }
  @if (values()['banner']) {
    <lenzi-info-bar lenziShellBanner icon="visibility" tone="tertiary" actionLabel="Exit" (action)="log('exit')">Viewing as <strong>lenzi</strong></lenzi-info-bar>
  }
  @if (values()['below']) {
    <lenzi-info-bar lenziShellBelow icon="cloud_off">Offline · data from 14:32</lenzi-info-bar>
  }
  <main class="page">
    @for (row of rows; track row) {
      <div class="row">
        <span class="name">Consumption {{ row }}</span>
        <span class="detail">Scroll: the top bar stays, its glass over the page.</span>
      </div>
    }
  </main>
</lenzi-app-shell>
