<lenzi-background
  [color]="text('color', '--mat-sys-surface')"
  [gradient]="gradient()"
  [image]="text('image', '')"
  [fit]="fit()"
  [dim]="num('dim', 0)"
  [blur]="num('blur', 0)"
/>

<mat-card appearance="outlined" lenziLit class="card">
  <mat-card-content>
    <p class="name">A plain background</p>
    <p class="words">A colour, a gradient over it, a picture under the gradient. This card is glass over it.</p>
  </mat-card-content>
</mat-card>
