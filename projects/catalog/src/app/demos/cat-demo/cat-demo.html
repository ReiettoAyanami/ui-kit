@switch (behind()) {
  @case ('blobs') {
    <lenzi-blob-background />
  }
  @case ('flock') {
    <lenzi-flock-background [count]="500" [trails]="0.5" />
  }
  @case ('picture') {
    <lenzi-background image="demo/hills.svg" />
  }
}

<!-- The floor: lit by the lamps, under the cat, so a solid cat's shadow falls on it. -->
<div class="field lenzi-lit-under" lenziLit [class.over-background]="behind() !== 'dark'">
  <div class="item" cdkDrag cdkDragBoundary=".field" (cdkDragEnded)="dropped()">
    <button
      mat-fab
      type="button"
      [attr.aria-label]="bulb() ? 'Switch off the bulb' : 'Switch on the bulb'"
      [attr.aria-pressed]="bulb()"
      [lenziGlow]="bulb()"
      glowColor="#f4ecff"
      [glowStrength]="strength()"
      [glowReach]="reach()"
      (click)="tapped()"
    >
      <mat-icon>{{ bulb() ? 'lightbulb' : 'lightbulb_outline' }}</mat-icon>
    </button>
  </div>

  <div class="item" cdkDrag cdkDragBoundary=".field">
    <lenzi-cat
      [expression]="expression()"
      [back]="back()"
      [material]="material()"
      [glass]="glass()"
      [size]="size()"
      [animated]="animated()"
      [pettable]="values()['pettable'] !== false"
      [glowColor]="color()"
      [glowStrength]="strength()"
      [glowReach]="reach()"
      label="lenzi's cat"
    />
  </div>
</div>
