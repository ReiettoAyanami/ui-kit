<button mat-flat-button type="button" (click)="send()">Send the request</button>
@if (error(); as error) {
  <kit-figure-grid class="facts">
    <kit-figure label="What the page says" [value]="line()" />
    <kit-figure label="The server answered" [value]="unreachable() ? 'no: unreachable' : 'yes'" />
  </kit-figure-grid>
  <app-markdown [source]="json()" />
}
