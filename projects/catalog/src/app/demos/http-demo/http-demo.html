<button mat-flat-button type="button" (click)="send()">Send the request</button>
@if (error(); as error) {
  <lenzi-figure-grid class="facts">
    <lenzi-figure label="What the page says" [value]="line()" />
    <lenzi-figure label="The server answered" [value]="unreachable() ? 'no: unreachable' : 'yes'" />
  </lenzi-figure-grid>
  <app-markdown [source]="json()" />
}
