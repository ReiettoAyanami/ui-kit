@if (show() === 'colours') {
  <p class="hint">Click a colour to change it: it applies everywhere at once. Save it from the Variables tab.</p>
  <div class="swatches">
    @for (role of roles; track role.variable) {
      <div class="swatch">
        <lenzi-color-picker
          [value]="colours()[role.variable]"
          [label]="role.name"
          [size]="36"
          (valueChange)="apply(role.variable, $event)"
          (picked)="picked(role.name, $event)"
        />
        <lenzi-figure [label]="role.name" [value]="colours()[role.variable]" />
      </div>
    }
  </div>
} @else {
  <div class="type">
    @for (style of type; track style) {
      <div class="sample">
        <span class="sample-name">{{ style }}</span>
        <span class="sample-text" [style.font]="'var(--mat-sys-' + style + ')'">Consumptions 264 g €8.93</span>
      </div>
    }
  </div>
}
