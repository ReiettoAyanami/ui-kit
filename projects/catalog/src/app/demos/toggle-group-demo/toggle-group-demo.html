<mat-button-toggle-group [hideSingleSelectionIndicator]="!values()['indicator']" aria-label="Price shown" [value]="chosen()" (change)="choose($event.value)">
  @for (option of options(); track option) {
    <mat-button-toggle [value]="option">{{ option }}</mat-button-toggle>
  }
</mat-button-toggle-group>
<p class="shown">Shown: <strong>{{ chosen() }}</strong></p>
