<lenzi-figure-grid>
  <lenzi-figure label="describeError(error)" [value]="described()" />
  <lenzi-figure label="couldNotLoad('the substances', error)" [value]="loadFailed()" />
  <lenzi-figure label="lenziPhone(): this frame" [value]="phone() ? 'a phone' : 'not a phone'" />
</lenzi-figure-grid>
<p class="label">A choice this browser remembers (reload the frame: it stays)</p>
<mat-button-toggle-group hideSingleSelectionIndicator aria-label="Per" [value]="per()" (change)="choose($event.value)">
  <mat-button-toggle value="day">day</mat-button-toggle>
  <mat-button-toggle value="week">week</mat-button-toggle>
  <mat-button-toggle value="month">month</mat-button-toggle>
</mat-button-toggle-group>
