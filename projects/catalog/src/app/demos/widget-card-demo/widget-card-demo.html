<kit-widget-card
  [title]="'' + values()['title']"
  [icon]="'' + values()['icon']"
  [subtitle]="values()['subtitle'] ? '' + values()['subtitle'] : null"
  [scales]="scales()"
  [scale]="scale()"
  (scaleChange)="choose($event)"
>
  <kit-figure-grid>
    <kit-figure label="This {{ scale() }}" value="€42.80" />
    <kit-figure label="The one before" value="€51.10" />
  </kit-figure-grid>
  <kit-segmented-bar class="bar" label="Spent by substance" [segments]="segments" max="100" />
</kit-widget-card>
