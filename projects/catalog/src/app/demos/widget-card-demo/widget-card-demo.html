<lenzi-widget-card
  [title]="'' + values()['title']"
  [icon]="'' + values()['icon']"
  [subtitle]="values()['subtitle'] ? '' + values()['subtitle'] : null"
  [scales]="scales()"
  [scale]="scale()"
  (scaleChange)="choose($event)"
>
  <lenzi-figure-grid>
    <lenzi-figure label="This {{ scale() }}" value="€42.80" />
    <lenzi-figure label="The one before" value="€51.10" />
  </lenzi-figure-grid>
  <lenzi-segmented-bar class="bar" label="Spent by substance" [segments]="segments" max="100" />
</lenzi-widget-card>
