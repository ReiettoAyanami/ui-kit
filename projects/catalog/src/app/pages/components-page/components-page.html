<main class="page" lenziGlassPage>
  <lenzi-search-bar class="search" lenziShellSearch placeholder="Search the components" [value]="q() ?? ''" (search)="search($event)" />

  @for (group of groups(); track group.category) {
    <section class="group">
      <h2 class="category">{{ group.category }}</h2>
      <div class="cards">
        @for (doc of group.docs; track doc.id) {
          <a class="card" [lenziLit]="lit()" [routerLink]="['/components', doc.id]">
            <span class="name">{{ doc.name }}</span>
            <span class="summary">{{ doc.summary }}</span>
            <code class="api">{{ doc.api }}</code>
          </a>
        }
      </div>
    </section>
  } @empty {
    <lenzi-status-message [text]="q() ? 'Nothing with “' + q() + '” in the kit' : 'No components to show'" />
  }
</main>
