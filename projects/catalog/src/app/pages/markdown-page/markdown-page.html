<main class="page">
  @if (kind() === 'ai') {
    <p class="for-claude">
      <mat-icon aria-hidden="true">smart_toy</mat-icon>
      <span>Instructions for Claude, the same file Claude reads before any frontend work: <code>projects/kit/{{ file() }}</code>.</span>
    </p>
  }
  @if (failure(); as failure) {
    <lenzi-status-message kind="error" [text]="failure" />
  } @else if (document.hasValue()) {
    <app-markdown [source]="document.value()" />
  } @else {
    <lenzi-status-message kind="loading" />
  }
</main>
