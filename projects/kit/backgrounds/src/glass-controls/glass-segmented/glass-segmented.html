<div
  class="track"
  role="radiogroup"
  tabindex="0"
  [attr.aria-label]="label()"
  [attr.aria-disabled]="disabled() || null"
  [class.moving]="moving()"
  [style.--lenzi-segments]="options().length"
  [style.--lenzi-segment-at]="index()"
  (keydown)="key($event)"
>
  @for (option of options(); track $index; let i = $index) {
    <button type="button" role="radio" class="segment" tabindex="-1" [class.chosen]="i === index()" [attr.aria-checked]="i === index()" [disabled]="disabled()" (click)="pick(i)">
      {{ option.label }}
    </button>
  }
  <span #pill class="pill" aria-hidden="true"></span>
</div>
