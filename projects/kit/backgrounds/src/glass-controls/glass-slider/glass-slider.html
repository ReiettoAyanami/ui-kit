<div
  #rail
  class="track"
  role="slider"
  [attr.tabindex]="disabled() ? -1 : 0"
  [class.active]="active()"
  [class.dragging]="dragging()"
  [class.disabled]="disabled()"
  [style.--lenzi-slider-at]="fraction()"
  [style.--lenzi-slider-over.px]="over()"
  [style.--lenzi-slider-room.px]="room()"
  [attr.aria-label]="label()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="value()"
  [attr.aria-valuetext]="valueText()"
  [attr.aria-disabled]="disabled() || null"
  (pointerdown)="down($event)"
  (pointermove)="move($event)"
  (pointerup)="up()"
  (pointercancel)="up()"
  (keydown)="key($event)"
  (focus)="focused.set(true)"
  (blur)="focused.set(false)"
>
  @if (track() === 'wave') {
    @let wave = waveMask();
    <!-- Android's music player: the fill a wave, flowing; the rest a line -->
    <span
      #line
      class="rail wave"
      [class.still]="!waveMoving()"
      aria-hidden="true"
      [style.--lenzi-wave]="wave.image"
      [style.--lenzi-wave-length.px]="wave.length"
      [style.--lenzi-wave-height.px]="wave.height"
      ><span class="fill"></span><span class="rest"></span
    ></span>
  } @else {
    <span #line class="rail" aria-hidden="true"><span class="fill"></span></span>
  }
  <!-- its knob (lenzi, 2026-11-26: "rendi il pomello la sua entità propria"): the page's, or its own of the shapes
       asked for (thumb, lens) -->
  <span class="thumb">
    <ng-content select="lenzi-glass-knob" />
    @if (!hasKnob()) {
      <lenzi-glass-knob [shape]="thumb()" [lensShape]="lens()" />
    }
  </span>
</div>
