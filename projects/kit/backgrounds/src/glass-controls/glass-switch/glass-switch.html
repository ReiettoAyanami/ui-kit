<button
  #track
  type="button"
  role="switch"
  class="track"
  [class.on]="checked()"
  [class.active]="active()"
  [class.dragging]="dragAt() !== null"
  [style.--lenzi-switch-at]="position()"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (pointerdown)="down($event)"
  (pointermove)="move($event)"
  (pointerup)="up()"
  (pointercancel)="cancel()"
  (click)="clicked()"
>
  <span #thumb class="thumb" aria-hidden="true"></span>
</button>
<!-- what it switches, beside it: a tap on it switches it too -->
<span class="text" (click)="tapText()"><ng-content /></span>
