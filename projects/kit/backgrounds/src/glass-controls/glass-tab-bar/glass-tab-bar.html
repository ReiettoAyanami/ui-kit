<nav class="bar" [attr.aria-label]="label()">
  <div #capsule class="capsule pages" [class.moving]="moving()">
    <span
      #lens
      class="pill"
      aria-hidden="true"
      [class.shown]="pill() !== null"
      [class.placed]="placed()"
      [style.translate]="upright() ? '0 ' + (pill()?.top ?? 0) + 'px' : (pill()?.left ?? 0) + 'px 0'"
      [style.width.px]="upright() ? null : (pill()?.width ?? 0)"
      [style.height.px]="upright() ? (pill()?.height ?? 0) : null"
    ></span>
    @for (entry of pages(); track key(entry); let i = $index) {
      @if (entry.link !== undefined) {
        <a
          #tab
          class="tab"
          [matTooltip]="upright() ? entry.label : ''"
          matTooltipPosition="right"
          [class.current]="i === active()"
          [routerLink]="entry.link"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="match(entry)"
          (isActiveChange)="routeActive(i, $event)"
          (click)="follow(entry, i)"
        >
          <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
          <span class="name">{{ entry.label }}</span>
        </a>
      } @else {
        <button #tab type="button" class="tab" [matTooltip]="upright() ? entry.label : ''" matTooltipPosition="right" (click)="press(entry)">
          <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
          <span class="name">{{ entry.label }}</span>
        </button>
      }
    }
  </div>

  @if (bottom().length) {
    <!-- the rest, apart from the pages -->
    <div #rest class="capsule rest">
      @for (entry of bottom(); track key(entry)) {
        @if (entry.link !== undefined) {
          <a
            class="tab"
          [matTooltip]="upright() ? entry.label : ''"
          matTooltipPosition="right"
            [routerLink]="entry.link"
            routerLinkActive="current"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="match(entry)"
            (click)="follow(entry)"
          >
            <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
            <span class="name">{{ entry.label }}</span>
          </a>
        } @else {
          <button type="button" class="tab" [matTooltip]="upright() ? entry.label : ''" matTooltipPosition="right" (click)="press(entry)">
            <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
            <span class="name">{{ entry.label }}</span>
          </button>
        }
      }
    </div>
  }
</nav>
