<nav class="bar" [attr.aria-label]="label()">
  <div #capsule class="capsule pages lenzi-floating" [class.moving]="moving()">
    <span
      #lens
      class="pill"
      aria-hidden="true"
      [class.shown]="pill() !== null"
      [class.placed]="placed()"
      [style.left.px]="pill()?.left ?? 0"
      [style.width.px]="pill()?.width ?? 0"
    ></span>
    @for (entry of pages(); track key(entry); let i = $index) {
      @if (entry.link !== undefined) {
        <a
          #tab
          class="tab"
          [class.current]="i === active()"
          [routerLink]="entry.link"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="match(entry)"
          (isActiveChange)="activated(i, $event)"
          (click)="follow(entry)"
        >
          <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
          <span class="name">{{ entry.label }}</span>
        </a>
      } @else {
        <button #tab type="button" class="tab" (click)="press(entry)">
          <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
          <span class="name">{{ entry.label }}</span>
        </button>
      }
    }
  </div>

  @if (bottom().length) {
    <!-- the rest, apart from the pages -->
    <div class="capsule rest lenzi-floating">
      @for (entry of bottom(); track key(entry)) {
        @if (entry.link !== undefined) {
          <a
            class="tab"
            [routerLink]="entry.link"
            routerLinkActive="current"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="match(entry)"
            (click)="follow(entry)"
          >
            <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
            <span class="name">{{ entry.label }}</span>
          </a>
        } @else {
          <button type="button" class="tab" (click)="press(entry)">
            <mat-icon class="icon" aria-hidden="true">{{ entry.icon }}</mat-icon>
            <span class="name">{{ entry.label }}</span>
          </button>
        }
      }
    </div>
  }
</nav>
