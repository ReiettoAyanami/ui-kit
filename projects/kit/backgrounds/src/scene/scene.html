@let shown = layout();
@let making = editing();
@if (shown.flocking) {
  <lenzi-blob-flock-background
    [fill]="fill()"
    [animate]="animate() && !making"
    [blobSpecs]="shown.blobs"
    [travel]="travel()"
    [boidFlocks]="making ? noFleets : shown.boidFlocks"
    [blobFlocks]="making ? noFleets : shown.blobFlocks"
    [follow]="shown.follow"
    [throwable]="shown.throwable && !making"
  />
} @else {
  <lenzi-blob-background
    [fill]="fill()"
    [animate]="animate() && !making"
    [blobSpecs]="shown.blobs"
    [travel]="travel()"
    [throwable]="shown.throwable && !making"
    [pull]="0"
  />
}
