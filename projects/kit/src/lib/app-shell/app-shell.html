<!-- The page never moves: hiding the app around it (bare) must not create the page again. -->
<mat-sidenav-container
  class="lenzi-shell"
  [class.lenzi-shell-bare]="isBare()"
  [class.lenzi-shell-compact]="compact()"
  [class.lenzi-shell-with-tabs]="tabs()"
  [class.lenzi-shell-tabs-upright]="tabsUpright()"
>
  <!-- Opened, the focus goes to the current page's entry, not to the first one: a focused entry is
       drawn highlighted, and the first page looked selected on every page (lenzi, 2026-10-03). -->
  <mat-sidenav
    class="lenzi-shell-drawer"
    fixedInViewport
    [fixedTopGap]="8"
    [fixedBottomGap]="8"
    mode="over"
    autoFocus='[aria-current="page"]'
  ><ng-content select="[lenziShellNav]" /></mat-sidenav>

  <mat-sidenav-content class="lenzi-shell-content">
    <div class="lenzi-shell-banner"><ng-content select="[lenziShellBanner]" /></div>
    @if (!tabs()) {
      <mat-toolbar class="lenzi-shell-bar">
        <button mat-icon-button type="button" class="lenzi-shell-menu" [attr.aria-label]="menuLabel()" (click)="openNav($event)">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="lenzi-shell-title">{{ shownTitle() }}</span>
        <ng-container [ngTemplateOutlet]="actions" />
      </mat-toolbar>
    } @else {
      <!-- With the bar of pages, no top bar: the page's title, large, scrolling with the page (lenzi, 2026-11-25: "per
           ora togli la barra sopra che non ha senso, metti un titolo normale un po' grande") -->
      <header class="lenzi-shell-heading">
        <h1 class="lenzi-shell-heading-title">{{ shownTitle() }}</h1>
        <ng-container [ngTemplateOutlet]="actions" />
      </header>
    }
    <!-- the actions, in the top bar or beside the title: one place for them, wherever they are shown -->
    <ng-template #actions><ng-content select="[lenziShellActions]" /></ng-template>
    <div class="lenzi-shell-below"><ng-content select="[lenziShellBelow]" /></div>
    <ng-content />
    <!-- the navigation as a bar, floating at the bottom (navigation 'bar', or 'auto' on a phone) -->
    <div class="lenzi-shell-tabs"><ng-content select="[lenziShellTabs]" /></div>
  </mat-sidenav-content>
</mat-sidenav-container>
