<div class="bar" role="status" [class]="tone()">
  @if (icon(); as icon) {
    <mat-icon class="icon" aria-hidden="true">{{ icon }}</mat-icon>
  }
  <span class="text"><ng-content /></span>
  @if (actionLabel(); as label) {
    @if (actionHref(); as href) {
      <a mat-button class="action" [href]="href" target="_blank" rel="noopener">{{ label }}</a>
    } @else {
      <button mat-button type="button" class="action" [disabled]="actionDisabled()" (click)="action.emit()">{{ label }}</button>
    }
  }
</div>
