<button mat-icon-button type="button" class="bell" [attr.aria-label]="ariaLabel()" [matMenuTriggerFor]="menu" (menuOpened)="open()">
  <mat-icon
    [matBadge]="count() > 99 ? '99+' : count()"
    [matBadgeHidden]="count() === 0"
    matBadgeSize="small"
    aria-hidden="false"
    >{{ count() ? 'notifications_active' : 'notifications' }}</mat-icon
  >
</button>
<mat-menu #menu="matMenu" xPosition="before" class="lenzi-bell-menu">
  @for (item of shown(); track item.id) {
    @if (item.link !== undefined) {
      <a mat-menu-item [routerLink]="item.link" class="item">
        <ng-container *ngTemplateOutlet="row; context: { $implicit: item }" />
      </a>
    } @else {
      <button mat-menu-item type="button" class="item" (click)="selected.emit(item)">
        <ng-container *ngTemplateOutlet="row; context: { $implicit: item }" />
      </button>
    }
  } @empty {
    <p class="empty">{{ emptyText() }}</p>
  }
</mat-menu>

<ng-template #row let-item>
  @if (item.meta || item.when) {
    <span class="line">
      <span class="meta">{{ item.meta }}</span>
      <span class="when">{{ item.when }}</span>
    </span>
  }
  <span class="title">{{ item.title }}</span>
</ng-template>
