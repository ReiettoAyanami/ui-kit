<div class="track" [attr.role]="selectable() ? 'group' : 'img'" [class.only]="only() !== null" [attr.aria-label]="label()">
  @for (bar of bars(); track bar.id) {
    <div
      #tip="matTooltip"
      class="segment"
      [class.away]="!bar.shown"
      [attr.data-index]="bar.index"
      [attr.role]="selectable() ? 'button' : null"
      [attr.tabindex]="selectable() && bar.shown ? 0 : null"
      [attr.aria-label]="selectable() ? 'Select ' + bar.name : null"
      [style.flex-basis.%]="bar.widthPercent"
      [style.background-color]="bar.color"
      [matTooltip]="bar.tooltip"
      matTooltipPosition="above"
      matTooltipPositionAtOrigin
      matTooltipClass="lenzi-tooltip-lines"
      (mousemove)="follow($event, tip)"
      (pointerdown)="pointerDown($event)"
      (click)="segmentClick($event)"
      (keydown.enter)="pressed($event, bar.id)"
      (keydown.space)="pressed($event, bar.id)"
    ></div>
  }
</div>
