<div class="figure" [class.animated]="animated()" [class.petted]="petted()" [class]="'expression-' + expression()">
  <!-- the body: a material shaped as the cat -->
  @switch (material()) {
    @case ('glass') {
      <div class="shape" lenziLit [style.mask-image]="mask()"></div>
    }
    @case ('lamp') {
      <div
        class="shape"
        [lenziGlow]="true"
        [glowColor]="lampColor()"
        [glowStrength]="glowStrength()"
        [glowReach]="glowReach()"
        [style.mask-image]="mask()"
      ></div>
    }
    @case ('solid') {
      <div class="shape filled" lenziSolid [solidOutline]="shape().outline" [style.mask-image]="mask()"></div>
    }
    @default {
      <div class="shape filled" [style.mask-image]="mask()"></div>
    }
  }

  <!-- its lines, over it: in the lamp's colour when it is a lamp -->
  <svg #ink class="ink" [class.lit]="material() === 'lamp'" [style.--lenzi-cat-lamp]="lampColor()" [attr.viewBox]="viewBox" aria-hidden="true">
    <path fill-rule="evenodd" [attr.d]="shape().ink" />
    @if (face(); as face) {
      <!-- watching, the face leans a little towards what it looks at -->
      <g #faceGroup class="face">
        <!-- watching, the eyes themselves turn towards what it looks at (no pupils: lenzi's drawing has none) -->
        <g #eyeLeft class="gaze">
          <path class="eye" fill-rule="evenodd" [attr.d]="face.eyeLeft" />
        </g>
        <g #eyeRight class="gaze">
          <path class="eye" fill-rule="evenodd" [attr.d]="face.eyeRight" />
        </g>
        @if (pettable() && expression() !== 'sleepy') {
          <!-- petted, its eyes close, content (the sleepy face's closed eyes) -->
          <g class="closed">
            <path class="shut" fill-rule="evenodd" [attr.d]="closedEyes.eyeLeft" />
            <path class="shut" fill-rule="evenodd" [attr.d]="closedEyes.eyeRight" />
          </g>
        }
        <path class="mouth" fill-rule="evenodd" [attr.d]="face.mouth" />
        <path class="whiskers left" fill-rule="evenodd" [attr.d]="face.whiskersLeft" />
        <path class="whiskers right" fill-rule="evenodd" [attr.d]="face.whiskersRight" />
      </g>
    }
  </svg>
</div>
